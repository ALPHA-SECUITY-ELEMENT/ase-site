<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ASE // TACTICAL PLANNING BOARD</title>
<style>
  /* ───── RESET & VARIABLES ───── */
  :root {
    --bg: #0a0c0b;
    --bg-2: #111513;
    --ink: #e9e6df;
    --muted: #8b8f88;
    --accent: #c8a94a;
    --line: rgba(233,230,223,.08);
    --font-head: 'Oswald', 'Impact', sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: var(--bg); color: var(--ink); font-family: var(--font-body); 
    height: 100vh; display: flex; flex-direction: column; overflow: hidden; 
  }
  a { color: inherit; text-decoration: none; }
  button, select, input { font-family: inherit; cursor: pointer; }

  /* ───── MAP SPECIFIC ───── */
  .map-wrapper { flex: 1; display: flex; flex-direction: column; height: 100%; }
  
  .map-toolbar {
    height: 64px; background: var(--bg-2); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0;
    flex-wrap: wrap; gap: 12px;
  }
  .map-title { font-family: var(--font-head); font-size: 16px; font-weight: 600; letter-spacing: .1em; color: var(--accent); }
  
  .toolbar-group { display: flex; gap: 12px; align-items: center; }
  .btn-tool, select, input { 
    background: var(--bg); border: 1px solid var(--line); color: var(--ink); 
    padding: 8px 16px; font-family: var(--font-head); font-size: 11px; 
    letter-spacing: .1em; transition: all .2s; outline: none; border-radius: 2px;
  }
  .btn-tool:hover, .btn-tool.active, select:hover, select:focus, input:focus { border-color: var(--accent); color: var(--accent); }
  
  /* ───── SYNC STATUS BAR ───── */
  .sync-bar {
    display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px;
    background: rgba(200,169,74,.1); border: 1px solid var(--accent); padding: 6px 12px; border-radius: 4px;
    color: var(--accent);
  }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #3ba55d; box-shadow: 0 0 6px #3ba55d; animation: pulse 2s infinite; }
  .sync-dot.offline { background: #ed4245; box-shadow: none; animation: none; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

  /* ───── SHARE MODAL ───── */
  .share-modal {
    display: none; position: fixed; inset: 0; z-index: 10001;
    background: rgba(10,12,11,.9); backdrop-filter: blur(4px);
    align-items: center; justify-content: center;
  }
  .share-modal.open { display: flex; }
  .share-box {
    background: var(--bg-2); border: 1px solid var(--accent); padding: 32px; border-radius: 4px; width: 100%; max-width: 400px; text-align: center;
  }
  .share-box h2 { font-family: var(--font-head); font-size: 24px; color: var(--accent); margin-bottom: 12px; }
  .share-box p { font-size: 13px; color: var(--muted); margin-bottom: 24px; line-height: 1.5; }
  .share-code {
    font-family: var(--font-mono); font-size: 32px; font-weight: 700; letter-spacing: 0.2em; color: var(--ink);
    background: var(--bg); padding: 12px; border: 1px dashed var(--line); margin-bottom: 24px;
  }
  .share-box input { width: 100%; text-align: center; font-family: var(--font-mono); font-size: 18px; letter-spacing: 0.1em; margin-bottom: 16px; }
  .close-modal { position: absolute; top: 16px; right: 16px; color: var(--muted); font-size: 20px; cursor: pointer; }
  .close-modal:hover { color: #ed4245; }

  /* ───── MAP CANVAS ───── */
  .map-container { flex: 1; position: relative; overflow: hidden; background: #000; cursor: crosshair; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
  
  /* ───── HUD PANELS ───── */
  .hud-panel {
    position: absolute; background: rgba(10,12,11,.85); border: 1px solid var(--line);
    padding: 16px; border-radius: 4px; backdrop-filter: blur(8px); pointer-events: none;
  }
  .hud-panel h4 { font-family: var(--font-mono); font-size: 10px; color: var(--muted); letter-spacing: .15em; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; }
  
  .coords-panel { bottom: 24px; left: 24px; min-width: 200px; }
  .hud-row { display: flex; justify-content: space-between; margin-bottom: 4px; font-family: var(--font-mono); font-size: 13px; }
  .hud-row .label { color: var(--muted); }
  .hud-row .val { color: var(--accent); font-weight: 700; }
  
  .marker-list {
    top: 24px; right: 24px; width: 280px; max-height: calc(100% - 48px);
    display: flex; flex-direction: column; pointer-events: auto;
  }
  .marker-head { padding: 12px 16px; border-bottom: 1px solid var(--line); font-family: var(--font-head); font-size: 12px; letter-spacing: .1em; color: var(--ink); display: flex; justify-content: space-between; align-items: center; }
  .marker-body { flex: 1; overflow-y: auto; padding: 8px; }
  .marker-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--bg-2); border: 1px solid var(--line); margin-bottom: 6px; border-radius: 2px; cursor: pointer; }
  .marker-item:hover { border-color: var(--accent); }
  .marker-item .m-info { display: flex; flex-direction: column; gap: 2px; }
  .marker-item .m-type { font-family: var(--font-head); font-size: 10px; letter-spacing: .1em; color: var(--ink); }
  .marker-item .m-coord { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .marker-item .m-del { font-size: 10px; color: #ed4245; opacity: 0.5; }
  .marker-item:hover .m-del { opacity: 1; }
  .empty-markers { font-size: 12px; color: var(--muted); text-align: center; padding: 20px; }

  /* ───── CUSTOM CURSOR ───── */
  body, a, button, * { cursor: none !important; }
  .cursor-dot, .cursor-ring {
    position: fixed; top: 0; left: 0; pointer-events: none; z-index: 10000;
    transform: translate(-50%, -50%); will-change: transform; mix-blend-mode: difference;
  }
  .cursor-dot { width: 6px; height: 6px; background: #fff; border-radius: 50%; }
  .cursor-ring {
    width: 38px; height: 38px; border: 1px solid #fff; border-radius: 50%;
    transition: width .25s ease, height .25s ease, border-color .25s ease, background .25s ease;
  }
  .cursor-ring.hover { width: 62px; height: 62px; border-color: #c8a94a; background: rgba(200,169,74,.08); }
  .cursor-ring.click { width: 26px; height: 26px; background: rgba(200,169,74,.25); }
  @media (pointer: coarse) {
    .cursor-dot, .cursor-ring { display: none; }
    body, a, button, * { cursor: auto !important; }
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<!-- PeerJS for WebRTC Multiplayer -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div class="cursor-dot"></div>
<div class="cursor-ring"></div>

<!-- SHARE MODAL -->
<div class="share-modal" id="share-modal">
  <div class="share-box" style="position: relative;">
    <span class="close-modal" onclick="document.getElementById('share-modal').classList.remove('open')">✕</span>
    <h2>TACTICAL SYNC</h2>
    
    <!-- Host View -->
    <div id="host-view" style="display: none;">
      <p>Share this code with your squad. They will see your markers in real-time.</p>
      <div class="share-code" id="room-code">----</div>
      <button class="btn-tool" style="width: 100%; border-color: var(--accent); color: var(--accent);" onclick="copyRoomCode()">COPY CODE</button>
    </div>

    <!-- Join View -->
    <div id="join-view">
      <p>Enter a squad code to join their planning board.</p>
      <input type="text" id="join-code-input" placeholder="XXXX" maxlength="4" style="text-transform: uppercase;">
      <button class="btn-tool" style="width: 100%; background: var(--accent); color: var(--bg); border-color: var(--accent);" onclick="joinRoom()">CONNECT</button>
      <div id="join-error" style="color: #ed4245; font-size: 11px; margin-top: 12px; min-height: 16px;"></div>
    </div>
  </div>
</div>

<div class="map-wrapper">
  <div class="map-toolbar">
    <div class="map-title">TACTICAL PLANNING BOARD</div>
    
    <div class="toolbar-group">
      <input type="file" id="map-upload" class="file-upload" accept="image/*" style="display:none;">
      <button class="btn-tool" id="btn-upload" style="border-color: var(--accent); color: var(--accent);">UPLOAD MAP</button>
      
      <select id="marker-type" style="border-color: var(--accent);">
        <option value="origin">ORIGIN (OP)</option>
        <option value="target">TARGET (TGT)</option>
        <option value="rally">RALLY POINT</option>
        <option value="objective">OBJECTIVE</option>
        <option value="support">SUPPORT</option>
        <option value="hazard">HAZARD</option>
      </select>

      <button class="btn-tool" id="mode-pan">PAN</button>
      <button class="btn-tool active" id="mode-mark">MARK</button>
      <button class="btn-tool" id="btn-clear">CLEAR</button>
    </div>

    <div class="toolbar-group">
      <div class="sync-bar" id="sync-status">
        <div class="sync-dot offline" id="sync-dot"></div>
        <span id="sync-text">OFFLINE</span>
      </div>
      <button class="btn-tool" id="btn-share" style="border-color: var(--ink);">SYNC SQUAD</button>
    </div>
  </div>

  <div class="map-container" id="map-container">
    <canvas id="map-canvas"></canvas>
    
    <div class="hud-panel coords-panel">
      <h4>TACTICAL HUD</h4>
      <div class="hud-row"><span class="label">GRID:</span><span class="val" id="hud-grid">--- ---</span></div>
      <div class="hud-row"><span class="label">RANGE:</span><span class="val" id="hud-range">--- m</span></div>
      <div class="hud-row"><span class="label">BEARING:</span><span class="val" id="hud-bearing">--- °</span></div>
    </div>

    <div class="hud-panel marker-list">
      <div class="marker-head">
        <span>MARKERS</span>
        <span id="marker-count">0</span>
      </div>
      <div class="marker-body" id="marker-body">
        <div class="empty-markers">Select a type and click to place.</div>
      </div>
    </div>
  </div>
</div>

<script>
// ───── CUSTOM CURSOR ─────
(() => {
  const dot = document.querySelector('.cursor-dot');
  const ring = document.querySelector('.cursor-ring');
  if (!dot || !ring) return;
  if (window.matchMedia('(pointer: coarse)').matches) return;

  let mx = window.innerWidth / 2, my = window.innerHeight / 2;
  let rx = mx, ry = my;

  window.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    dot.style.transform = `translate(${mx}px, ${my}px) translate(-50%, -50%)`;
  });

  const loop = () => {
    rx += (mx - rx) * 0.16;
    ry += (my - ry) * 0.16;
    ring.style.transform = `translate(${rx}px, ${ry}px) translate(-50%, -50%)`;
    requestAnimationFrame(loop);
  };
  loop();

  const hoverables = 'button, select, .marker-item';
  document.addEventListener('mouseover', e => {
    if (e.target.closest(hoverables)) ring.classList.add('hover');
  });
  document.addEventListener('mouseout', e => {
    if (e.target.closest(hoverables)) ring.classList.remove('hover');
  });

  window.addEventListener('mousedown', () => ring.classList.add('click'));
  window.addEventListener('mouseup', () => ring.classList.remove('click'));
})();

// ───── WEBRTC MULTIPLAYER LOGIC ─────
let peer = null;
let conn = null;
let isHost = false;

function updateSyncStatus(status, text) {
  const dot = document.getElementById('sync-dot');
  const label = document.getElementById('sync-text');
  const btn = document.getElementById('btn-share');
  
  if (status === 'host' || status === 'connected') {
    dot.classList.remove('offline');
    label.textContent = text;
    btn.textContent = status === 'host' ? 'ROOM: ' + text : 'CONNECTED';
    btn.style.borderColor = '#3ba55d';
    btn.style.color = '#3ba55d';
  } else {
    dot.classList.add('offline');
    label.textContent = text;
    btn.textContent = 'SYNC SQUAD';
    btn.style.borderColor = 'var(--ink)';
    btn.style.color = 'var(--ink)';
  }
}

function broadcast(data) {
  if (conn && conn.open) conn.send(data);
}

document.getElementById('btn-share').addEventListener('click', () => {
  if (conn || isHost) {
    // If already connected, clicking the button disconnects
    if (confirm('Disconnect from tactical sync?')) {
      if (conn) conn.close();
      if (peer) peer.destroy();
      peer = null; conn = null; isHost = false;
      updateSyncStatus('offline', 'OFFLINE');
    }
    return;
  }
  
  // Generate a 4-letter room code
  const code = Math.random().toString(36).substring(2, 6).toUpperCase();
  document.getElementById('room-code').textContent = code;
  document.getElementById('host-view').style.display = 'block';
  document.getElementById('join-view').style.display = 'none';
  document.getElementById('share-modal').classList.add('open');

  isHost = true;
  peer = new Peer('ASE-' + code); // Prefix to avoid collision on public server
  
  peer.on('open', () => {
    updateSyncStatus('host', code);
  });
  
  peer.on('connection', (connection) => {
    conn = connection;
    setupConnection();
  });
  
  peer.on('error', (err) => {
    alert('Sync error: ' + err.type);
    updateSyncStatus('offline', 'ERROR');
  });
});

function joinRoom() {
  const code = document.getElementById('join-code-input').value.toUpperCase();
  if (code.length < 4) return;
  
  document.getElementById('join-error').textContent = 'Connecting...';
  
  if (peer) peer.destroy();
  peer = new Peer(); // Joiner gets a random ID
  
  peer.on('open', () => {
    conn = peer.connect('ASE-' + code);
    setupConnection();
  });
  
  peer.on('error', (err) => {
    document.getElementById('join-error').textContent = 'Could not connect. Check code.';
  });
}

function setupConnection() {
  conn.on('open', () => {
    // If we just joined, request the current board state from the host
    if (!isHost) {
      conn.send({ type: 'request_state' });
      updateSyncStatus('connected', 'SQUAD LINK');
      document.getElementById('share-modal').classList.remove('open');
    }
  });
  
  conn.on('data', (data) => {
    // Handle incoming data from Host or Clients
    if (data.type === 'marker_add') {
      markers.push(data.marker);
      redraw();
      renderMarkerList();
    } else if (data.type === 'marker_clear') {
      markers = [];
      redraw();
      renderMarkerList();
    } else if (data.type === 'request_state') {
      // Host receives request, sends current state
      if (isHost) conn.send({ type: 'sync_state', markers: markers });
    } else if (data.type === 'sync_state') {
      // Client receives full state
      markers = data.markers;
      redraw();
      renderMarkerList();
    } else if (data.type === 'remove_marker') {
      markers.splice(data.index, 1);
      redraw();
      renderMarkerList();
    }
  });
  
  conn.on('close', () => {
    updateSyncStatus('offline', 'DISCONNECTED');
    conn = null;
  });
}

function copyRoomCode() {
  const code = document.getElementById('room-code').textContent;
  navigator.clipboard.writeText(code);
  alert('Squad code copied: ' + code);
}

// ───── TACTICAL MAP LOGIC ─────
let markers = [];
let mapImg = new Image();
let mapLoaded = false;
let isPanning = false;
let startX, startY;
let offsetX = 0, offsetY = 0;
let scale = 1;
let mode = 'mark';
let mousePos = { x: 0, y: 0 };

const canvas = document.getElementById('map-canvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('map-container');
const fileInput = document.getElementById('map-upload');
const typeSelect = document.getElementById('marker-type');

const styles = {
  origin:   { color: '#3ba55d', label: 'OP' },
  target:   { color: '#ed4245', label: 'TGT' },
  rally:    { color: '#c8a94a', label: 'RLY' },
  objective:{ color: '#c8a94a', label: 'OBJ' },
  support:  { color: '#5865f2', label: 'SUP' },
  hazard:   { color: '#f59e0b', label: 'HAZ' }
};

function resize() {
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;
  redraw();
}
window.addEventListener('resize', resize);

document.getElementById('btn-upload').addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (event) => {
    mapImg.onload = () => {
      mapLoaded = true;
      markers = [];
      renderMarkerList();
      
      const scaleX = canvas.width / mapImg.width;
      const scaleY = canvas.height / mapImg.height;
      scale = Math.min(scaleX, scaleY);
      offsetX = (canvas.width - mapImg.width * scale) / 2;
      offsetY = (canvas.height - mapImg.height * scale) / 2;
      
      redraw();
    };
    mapImg.src = event.target.result;
  };
  reader.readAsDataURL(file);
});

function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  if (!mapLoaded) {
    ctx.fillStyle = '#111513';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#8b8f88';
    ctx.font = '20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('NO MAP LOADED', canvas.width / 2, canvas.height / 2);
    return;
  }

  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);
  
  ctx.drawImage(mapImg, 0, 0);

  markers.forEach((m) => {
    const px = m.x;
    const py = m.y;
    const style = styles[m.type] || styles.rally;
    
    if (m.type === 'target') {
      const op = markers.find(x => x.type === 'origin');
      if (op) {
        ctx.beginPath();
        ctx.moveTo(op.x, op.y);
        ctx.lineTo(px, py);
        ctx.strokeStyle = 'rgba(237,66,69,0.5)';
        ctx.lineWidth = 2 / scale;
        ctx.setLineDash([5 / scale, 5 / scale]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    ctx.beginPath();
    if (m.type === 'origin') {
      ctx.moveTo(px, py - 10);
      ctx.lineTo(px + 10, py);
      ctx.lineTo(px, py + 10);
      ctx.lineTo(px - 10, py);
    } else if (m.type === 'target') {
      ctx.moveTo(px, py + 10);
      ctx.lineTo(px + 10, py - 10);
      ctx.lineTo(px - 10, py - 10);
    } else {
      ctx.rect(px - 8, py - 8, 16, 16);
    }
    
    ctx.fillStyle = style.color;
    ctx.fill();
    ctx.strokeStyle = '#0a0c0b';
    ctx.lineWidth = 1.5 / scale;
    ctx.stroke();
    
    ctx.fillStyle = '#0a0c0b';
    ctx.font = `bold ${10 / scale}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    if (m.type === 'origin' || m.type === 'target') {
      ctx.fillText(style.label, px, py);
    }
  });

  ctx.restore();
}

canvas.addEventListener('mousedown', (e) => {
  if (mode === 'pan' && mapLoaded) {
    isPanning = true;
    startX = e.clientX - offsetX;
    startY = e.clientY - offsetY;
    canvas.style.cursor = 'grabbing';
  }
});

window.addEventListener('mouseup', () => {
  isPanning = false;
  if (mode === 'pan') canvas.style.cursor = 'grab';
});

canvas.addEventListener('mousemove', (e) => {
  if (!mapLoaded) return;
  const rect = canvas.getBoundingClientRect();
  mousePos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  updateHUD((mousePos.x - offsetX) / scale, (mousePos.y - offsetY) / scale);

  if (isPanning) {
    offsetX = e.clientX - startX;
    offsetY = e.clientY - startY;
    redraw();
  }
});

canvas.addEventListener('click', (e) => {
  if (mode === 'mark' && mapLoaded && !isPanning) {
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;
    const mapX = (mouseX - offsetX) / scale;
    const mapY = (mouseY - offsetY) / scale;
    addMarker(mapX, mapY);
  }
});

canvas.addEventListener('wheel', (e) => {
  if (!mapLoaded) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;
  const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
  const newScale = Math.max(0.1, Math.min(scale * zoomFactor, 10));
  offsetX = mouseX - (mouseX - offsetX) * (newScale / scale);
  offsetY = mouseY - (mouseY - offsetY) * (newScale / scale);
  scale = newScale;
  redraw();
  updateHUD((mouseX - offsetX) / scale, (mouseY - offsetY) / scale);
}, { passive: false });

function getGrid(px, py) {
  if (!mapLoaded) return { x: '---', y: '---', px: 0, py: 0 };
  const mapW = mapImg.width;
  const mapH = mapImg.height;
  const normX = Math.max(0, Math.min(1, px / mapW));
  const normY = Math.max(0, Math.min(1, py / mapH));
  return { 
    x: String(Math.floor(normX * 100)).padStart(3, '0'), 
    y: String(Math.floor(normY * 100)).padStart(3, '0'), 
    px, py 
  };
}

function updateHUD(px, py) {
  const grid = getGrid(px, py);
  document.getElementById('hud-grid').textContent = `${grid.x} ${grid.y}`;
  
  const op = markers.find(m => m.type === 'origin');
  const tgt = markers.find(m => m.type === 'target');
  
  if (op && tgt) {
    const dx = tgt.px - op.px;
    const dy = tgt.py - op.py;
    const metersPerPixel = 10000 / mapImg.width;
    const distM = Math.sqrt(dx*dx + dy*dy) * metersPerPixel;
    let angle = Math.atan2(dx, -dy) * (180 / Math.PI);
    if (angle < 0) angle += 360;
    
    document.getElementById('hud-range').textContent = `${distM.toFixed(0)} m`;
    document.getElementById('hud-bearing').textContent = `${angle.toFixed(1)} °`;
  } else {
    document.getElementById('hud-range').textContent = `--- m`;
    document.getElementById('hud-bearing').textContent = `--- °`;
  }
}

function addMarker(mapX, mapY) {
  const type = typeSelect.value;
  if (type === 'origin') markers = markers.filter(m => m.type !== 'origin');
  if (type === 'target') markers = markers.filter(m => m.type !== 'target');

  const grid = getGrid(mapX, mapY);
  const newMarker = { x: mapX, y: mapY, px: mapX, py: mapY, grid: grid, type };
  
  markers.push(newMarker);
  broadcast({ type: 'marker_add', marker: newMarker });
  
  redraw();
  renderMarkerList();
  updateHUD((mousePos.x - offsetX) / scale, (mousePos.y - offsetY) / scale);
}

function renderMarkerList() {
  const list = document.getElementById('marker-body');
  document.getElementById('marker-count').textContent = markers.length;
  
  if (!markers.length) {
    list.innerHTML = '<div class="empty-markers">Select a type and click to place.</div>';
    return;
  }

  list.innerHTML = markers.map((m, i) => {
    const style = styles[m.type] || styles.rally;
    return `
      <div class="marker-item" onclick="deleteMarker(${i})">
        <div class="m-info">
          <span class="m-type" style="color: ${style.color}">${style.label}</span>
          <span class="m-coord">${m.grid.x} ${m.grid.y}</span>
        </div>
        <span class="m-del">✕</span>
      </div>
    `;
  }).reverse().join('');
}

window.deleteMarker = (index) => {
  const actualIndex = markers.length - 1 - index;
  markers.splice(actualIndex, 1);
  broadcast({ type: 'remove_marker', index: actualIndex });
  redraw();
  renderMarkerList();
  updateHUD((mousePos.x - offsetX) / scale, (mousePos.y - offsetY) / scale);
};

document.getElementById('mode-pan').addEventListener('click', (e) => {
  mode = 'pan';
  e.target.classList.add('active');
  document.getElementById('mode-mark').classList.remove('active');
  canvas.style.cursor = 'grab';
});

document.getElementById('mode-mark').addEventListener('click', (e) => {
  mode = 'mark';
  e.target.classList.add('active');
  document.getElementById('mode-pan').classList.remove('active');
  canvas.style.cursor = 'crosshair';
});

document.getElementById('btn-clear').addEventListener('click', () => {
  if (confirm('Clear all map markers?')) {
    markers = [];
    broadcast({ type: 'marker_clear' });
    redraw();
    renderMarkerList();
  }
});

canvas.style.cursor = 'crosshair';
resize();
</script>
</body>
</html>
