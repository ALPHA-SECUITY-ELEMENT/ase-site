<script>
(() => {
  const API_BASE = 'https://ase-api.1sfodboot.workers.dev';
  const gate = document.getElementById('portal-gate');
  const app = document.getElementById('portal-app');
  const input = document.getElementById('portal-password');
  const btn = document.getElementById('portal-unlock');
  const errorEl = document.getElementById('portal-error');

  setTimeout(() => input.focus(), 300);

  const unlock = async () => {
    const pw = input.value.trim();
    if (!pw) return;
    errorEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'AUTHENTICATING…';

    try {
      const r = await fetch(API_BASE + '/portal/unlock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
      });

      if (r.status === 401) {
        errorEl.textContent = 'Access Denied. Incorrect code.';
        btn.disabled = false;
        btn.textContent = 'UNLOCK PORTAL';
        input.select();
        return;
      }
      if (!r.ok) throw new Error('server error');

      gate.style.display = 'none';
      app.style.display = 'flex';
      sessionStorage.setItem('ase_portal_unlocked_v3', '1');
    } catch (err) {
      errorEl.textContent = 'System error. Try again.';
      btn.disabled = false;
      btn.textContent = 'UNLOCK PORTAL';
    }
  };

  btn.addEventListener('click', unlock);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

  if (sessionStorage.getItem('ase_portal_unlocked_v3') === '1') {
    gate.style.display = 'none';
    app.style.display = 'flex';
  }
})();
</script>
